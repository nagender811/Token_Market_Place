name: Test

on:
  push:
    branches: main
    
jobs: 
  forge-tests: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Foundry Toolchain
        uses: foundry-rs/foundry-toolchain@v1
      
      - name: Run Tests
        run: forge test --isolate -vvv
        env:
          FORGE_SNAPSHOT_CHECK: true

